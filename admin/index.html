<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inquiries">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="apple-touch-icon" href="/admin/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/admin/icon-192.png">
<title>Inquiries</title>
<style>
  :root {
    --inkwell: #141210; --oak: #221C14; --lith: #C05020; --faded: #304050;
    --parch: #C8B090; --foxed: #EDE0C0; --rule: rgba(200,176,144,0.22);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--inkwell); color: var(--foxed); font-family: var(--serif); font-size: 17px; line-height: 1.5; }
  body { min-height: 100vh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen { max-width: 640px; margin: 0 auto; padding: 1rem 1.1rem 3rem; }
  [hidden] { display: none !important; }
  h1 { font-size: 1.6rem; font-weight: normal; margin: 0; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.5rem 0 1rem; }
  .iconbtn { background: none; border: 1px solid var(--rule); color: var(--parch); font: inherit; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.5rem 0.85rem; cursor: pointer; }
  .iconbtn:active { color: var(--foxed); }
  .chips { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.9rem; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; background: none; color: var(--parch); border: 1px solid var(--rule); font: inherit; font-size: 0.85rem; padding: 0.4rem 0.9rem; border-radius: 999px; cursor: pointer; }
  .chip.on { background: var(--foxed); color: var(--inkwell); border-color: var(--foxed); }
  .card { display: block; width: 100%; text-align: left; background: var(--oak); color: inherit; border: 0; border-left: 3px solid var(--rule); font: inherit; padding: 0.9rem 1rem; margin-bottom: 0.6rem; cursor: pointer; }
  .card.is-new { border-left-color: var(--lith); }
  .card .top { display: flex; justify-content: space-between; gap: 0.75rem; align-items: baseline; }
  .card .name { font-size: 1.1rem; }
  .card .meta { color: var(--parch); font-size: 0.9rem; margin-top: 0.1rem; }
  .pill { flex: none; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 0.15rem 0.5rem; border: 1px solid var(--rule); color: var(--parch); }
  .pill.new { background: var(--lith); border-color: var(--lith); color: var(--foxed); }
  .pill.contract { background: var(--faded); border-color: var(--faded); color: var(--foxed); }
  .pill.signed { background: var(--foxed); border-color: var(--foxed); color: var(--inkwell); }
  .pill.booked { background: #5E7A4A; border-color: #5E7A4A; color: var(--foxed); }
  .pill.passed { opacity: 0.6; }
  .empty { color: var(--parch); text-align: center; padding: 2.5rem 0; }
  label { display: block; font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--parch); margin: 1.4rem 0 0.4rem; }
  input[type=password], textarea { width: 100%; background: var(--oak); color: var(--foxed); border: 1px solid var(--rule); font: inherit; font-size: 1rem; padding: 0.8rem; border-radius: 0; }
  textarea { min-height: 120px; resize: vertical; }
  .btn { background: var(--lith); color: var(--foxed); border: 0; font: inherit; font-size: 0.9rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 0.85rem 1.4rem; cursor: pointer; }
  .btn:disabled { opacity: 0.6; }
  .err { color: #E08A5E; min-height: 1.4rem; margin-top: 0.75rem; font-size: 0.95rem; }
  .login { padding-top: 22vh; }
  .login h1 { margin-bottom: 1.5rem; }
  .back { margin: 0.25rem 0 1rem; }
  .detail h1 { font-size: 1.8rem; line-height: 1.2; margin-bottom: 0.25rem; }
  .sub { color: var(--parch); margin: 0 0 1rem; }
  .actions { display: flex; gap: 0.6rem; margin: 1rem 0 0.25rem; flex-wrap: wrap; }
  .actions a { background: var(--lith); color: var(--foxed); text-decoration: none; font-size: 0.85rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 0.75rem 1.2rem; }
  dl { margin: 0; }
  dt { font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--parch); margin-top: 1.1rem; }
  dd { margin: 0.15rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .seg { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .seg button { background: none; color: var(--parch); border: 1px solid var(--rule); font: inherit; font-size: 0.9rem; padding: 0.55rem 0.9rem; cursor: pointer; }
  .seg button.on { background: var(--foxed); color: var(--inkwell); border-color: var(--foxed); }
  .saved { color: var(--parch); font-size: 0.85rem; margin-left: 0.8rem; }
  .panel { background: var(--oak); border-left: 3px solid var(--lith); padding: 1rem 1.1rem; margin: 1.2rem 0 0; }
  .panel h2 { font-size: 1.05rem; font-weight: normal; margin: 0 0 0.4rem; }
  .panel p { margin: 0.2rem 0; color: var(--parch); }
  .panel .row2 { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.9rem; }
  .btn2 { display: inline-block; background: none; color: var(--foxed); border: 1px solid var(--parch); font: inherit; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.65rem 1rem; text-decoration: none; cursor: pointer; }
  .btn2.solid { background: var(--lith); border-color: var(--lith); }
  input[type=text], input[type=number], input[type=date], input[type=time], input[type=email] { width: 100%; background: var(--oak); color: var(--foxed); border: 1px solid var(--rule); font: inherit; font-size: 1rem; padding: 0.8rem; border-radius: 0; color-scheme: dark; }
  .two { display: flex; gap: 0.8rem; } .two > div { flex: 1; min-width: 0; }
  .hint { color: var(--parch); font-size: 0.9rem; margin: 0.4rem 0 0; }
  .sumbox { background: var(--oak); padding: 0.8rem 1rem; margin-top: 1.2rem; color: var(--parch); white-space: pre-line; }
  select { width: 100%; background: var(--oak); color: var(--foxed); border: 1px solid var(--rule); font: inherit; font-size: 1rem; padding: 0.8rem; border-radius: 0; appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--parch) 50%), linear-gradient(135deg, var(--parch) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
  .editor { background: var(--oak); border-left: 3px solid var(--faded); padding: 0.2rem 1rem 1rem; margin-top: 0.8rem; }
  .editor label:first-child { margin-top: 0.8rem; }
  .dangerzone { margin-top: 3.5rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
  .linkbtn.danger { color: #C0623A; margin-right: 0; }
  .linkbtn { background: none; border: 0; color: var(--parch); font: inherit; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: underline; padding: 0.4rem 0; margin-right: 1.2rem; cursor: pointer; }
</style>
</head>
<body>

<section class="screen login" id="login" hidden>
  <h1>Inquiries</h1>
  <form id="login-form">
    <label for="pass" style="margin-top:0">Passphrase</label>
    <input type="password" id="pass" autocomplete="current-password" required>
    <div style="margin-top:1rem"><button class="btn" id="login-btn" type="submit">Sign in</button></div>
    <div class="err" id="login-err" role="alert"></div>
  </form>
</section>

<section class="screen" id="list" hidden>
  <div class="bar">
    <h1>Inquiries</h1>
    <div>
      <button class="iconbtn" id="refresh" type="button">Refresh</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="items"></div>
  <p style="margin-top:2rem"><button class="iconbtn" id="logout" type="button">Sign out</button></p>
</section>

<section class="screen detail" id="detail" hidden>
  <div class="back"><button class="iconbtn" id="back" type="button">&larr; All inquiries</button></div>
  <h1 id="d-name"></h1>
  <p class="sub" id="d-sub"></p>
  <div class="actions" id="d-actions"></div>
  <div id="d-contract"></div>
  <label>Status</label>
  <div class="seg" id="d-status"></div>
  <dl id="d-fields"></dl>
  <label for="d-notes">Your notes</label>
  <textarea id="d-notes"></textarea>
  <p><button class="btn" id="d-save" type="button">Save notes</button><span class="saved" id="d-saved"></span></p>
  <div class="dangerzone">
    <button class="linkbtn danger" id="d-delete" type="button">Delete inquiry</button>
    <p class="hint" id="d-delmsg"></p>
  </div>
</section>

<section class="screen" id="cform" hidden>
  <div class="back"><button class="iconbtn" id="cf-back" type="button">&larr; Back</button></div>
  <h1 id="cf-title">Start contract</h1>
  <label>Experience</label>
  <div class="seg" id="cf-exp"></div>
  <p class="hint" id="cf-exp-hint"></p>
  <label for="cf-date">Event date</label>
  <input type="date" id="cf-date">
  <div class="two">
    <div><label for="cf-start">Start time</label><input type="time" id="cf-start"></div>
    <div><label for="cf-end">End time</label><input type="time" id="cf-end"></div>
  </div>
  <label for="cf-venue">Venue name and address</label>
  <textarea id="cf-venue" style="min-height:80px"></textarea>
  <label for="cf-profile">Pricing</label>
  <select id="cf-profile"></select>
  <div class="sumbox" id="cf-pinfo" hidden></div>
  <div id="cf-pactions" hidden>
    <button class="linkbtn" id="cf-pedit" type="button">Edit profile</button>
    <button class="linkbtn" id="cf-pdel" type="button">Delete profile</button>
  </div>
  <div class="editor" id="cf-editor" hidden>
    <label for="pf-name">Profile name</label>
    <input type="text" id="pf-name" maxlength="60" placeholder="Name it to save it, or leave blank to use once">
    <div class="two">
      <div><label for="pf-rb">Rounds, first 2 hrs ($)</label><input type="number" id="pf-rb" inputmode="decimal" min="0" step="0.01"></div>
      <div><label for="pf-re">Rounds, each extra hr ($)</label><input type="number" id="pf-re" inputmode="decimal" min="0" step="0.01"></div>
    </div>
    <div class="two">
      <div><label for="pf-sb">Station, first 2 hrs ($)</label><input type="number" id="pf-sb" inputmode="decimal" min="0" step="0.01"></div>
      <div><label for="pf-se">Station, each extra hr ($)</label><input type="number" id="pf-se" inputmode="decimal" min="0" step="0.01"></div>
    </div>
    <label for="pf-hf">Show, flat fee ($)</label><input type="number" id="pf-hf" inputmode="decimal" min="0" step="0.01">
    <p class="hint">Overtime on The Rounds and The Station uses the extra-hour rate, billed in 30 minute blocks at half. The Show has no overtime. Leave the name blank to use these prices for this contract only.</p>
    <p style="margin-top:1rem"><button class="btn2 solid" id="pf-save" type="button">Save profile</button><span class="saved" id="pf-msg"></span></p>
  </div>
  <label for="cf-fee">Total fee ($)</label>
  <input type="number" id="cf-fee" inputmode="decimal" min="0" step="0.01">
  <p class="hint" id="cf-feehint" hidden><button class="linkbtn" id="cf-recalc" type="button">Use calculated fee</button></p>
  <div class="sumbox" id="cf-sum">Enter the fee to see the deposit.</div>
  <label for="cf-cname">Client name</label>
  <input type="text" id="cf-cname">
  <label for="cf-cemail">Client email</label>
  <input type="email" id="cf-cemail">
  <p style="margin-top:1.4rem"><button class="btn" id="cf-create" type="button">Create link</button></p>
  <div class="err" id="cf-err" role="alert"></div>
</section>

<script>
(function () {
  var STATUSES = [["new", "New"], ["replied", "Replied"], ["contract", "Contract sent"], ["signed", "Signed"], ["booked", "Booked"], ["passed", "Passed"]];
  var LABEL = {}; STATUSES.forEach(function (s) { LABEL[s[0]] = s[1]; });
  var FILTERS = [["open", "Open"], ["booked", "Booked"], ["passed", "Passed"], ["all", "All"]];
  var items = [], filter = "open";

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function show(which) {
    ["login", "list", "detail", "cform"].forEach(function (s) { $(s).hidden = s !== which; });
    window.scrollTo(0, 0);
  }

  function api(path, body) {
    var opts = body === undefined ? { credentials: "same-origin" } : {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    };
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { d.httpStatus = r.status; return d; });
    });
  }

  function ago(ms) {
    var s = Math.max(1, Math.floor((Date.now() - ms) / 1000));
    if (s < 3600) return Math.max(1, Math.floor(s / 60)) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    if (s < 86400 * 14) return Math.floor(s / 86400) + "d ago";
    return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function fullName(i) { return (i.first_name + " " + (i.last_name || "")).trim(); }

  function matches(i) {
    if (filter === "all") return true;
    if (filter === "open") return i.status === "new" || i.status === "replied" || i.status === "contract" || i.status === "signed";
    return i.status === filter;
  }

  function renderChips() {
    var box = $("chips"); box.replaceChildren();
    var newCount = items.filter(function (i) { return i.status === "new"; }).length;
    FILTERS.forEach(function (f) {
      var label = f[1] + (f[0] === "open" && newCount ? " (" + newCount + " new)" : "");
      var b = el("button", "chip" + (filter === f[0] ? " on" : ""), label);
      b.type = "button";
      b.addEventListener("click", function () { filter = f[0]; renderList(); });
      box.appendChild(b);
    });
  }

  function renderList() {
    renderChips();
    var box = $("items"); box.replaceChildren();
    var shown = items.filter(matches);
    if (!shown.length) { box.appendChild(el("p", "empty", items.length ? "Nothing here." : "No inquiries yet.")); return; }
    shown.forEach(function (i) {
      var c = el("button", "card" + (i.status === "new" ? " is-new" : ""));
      c.type = "button";
      var top = el("div", "top");
      top.appendChild(el("span", "name", fullName(i)));
      top.appendChild(el("span", "pill " + i.status, LABEL[i.status] || i.status));
      c.appendChild(top);
      var meta = [i.event_type, i.event_date].filter(Boolean).join(" · ");
      c.appendChild(el("div", "meta", meta));
      c.appendChild(el("div", "meta", "Received " + ago(i.created_at)));
      c.addEventListener("click", function () { location.hash = "#" + i.id; });
      box.appendChild(c);
    });
  }

  function field(dl, label, value) {
    if (!value) return;
    dl.appendChild(el("dt", null, label));
    dl.appendChild(el("dd", null, value));
  }

  function renderDetail(id) {
    var i = items.filter(function (x) { return x.id === id; })[0];
    if (!i) { location.hash = ""; return; }
    $("d-name").textContent = fullName(i);
    $("d-sub").textContent = "Received " + new Date(i.created_at).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

    var acts = $("d-actions"); acts.replaceChildren();
    var mail = el("a", null, "Email"); mail.href = "mailto:" + i.email; acts.appendChild(mail);

    renderContractPanel(i);

    var seg = $("d-status"); seg.replaceChildren();
    STATUSES.forEach(function (s) {
      var b = el("button", i.status === s[0] ? "on" : "", s[1]); b.type = "button";
      b.addEventListener("click", function () {
        var prev = i.status; i.status = s[0]; renderDetail(id);
        api("/api/admin/update", { id: i.id, status: s[0] }).then(function (d) {
          if (!d.ok) { i.status = prev; renderDetail(id); alert("Could not save the status. Try again."); }
        });
      });
      seg.appendChild(b);
    });

    var dl = $("d-fields"); dl.replaceChildren();
    field(dl, "Email", i.email);
    field(dl, "Event type", i.event_type);
    field(dl, "Date or timing", i.event_date);
    field(dl, "Guests", i.guest_count);
    field(dl, "Location", i.location);
    field(dl, "Message", i.message);

    $("d-notes").value = i.notes || "";
    $("d-saved").textContent = "";
    $("d-save").onclick = function () {
      var v = $("d-notes").value;
      $("d-save").disabled = true;
      api("/api/admin/update", { id: i.id, notes: v }).then(function (d) {
        $("d-save").disabled = false;
        if (d.ok) { i.notes = v; $("d-saved").textContent = "Saved"; } else { $("d-saved").textContent = "Not saved. Try again."; }
      });
    };
    var del = $("d-delete"), delMsg = $("d-delmsg"), delTimer;
    var signed = i.contract && i.contract.status === "signed";
    var hasContract = !!i.contract;
    function resetDelete() { del.textContent = "Delete inquiry"; delMsg.textContent = ""; del.dataset.armed = ""; }
    resetDelete();
    del.onclick = function () {
      if (!del.dataset.armed) {
        del.dataset.armed = "1";
        del.textContent = "Tap again to permanently delete";
        delMsg.textContent = signed ? "This inquiry has a SIGNED contract. Deleting erases the signed agreement too." : (hasContract ? "This also deletes its contract." : "");
        clearTimeout(delTimer); delTimer = setTimeout(resetDelete, 6000);
        return;
      }
      clearTimeout(delTimer); del.disabled = true;
      api("/api/admin/inquiry-delete", { id: i.id }).then(function (d) {
        del.disabled = false;
        if (d.ok) { items = items.filter(function (x) { return x.id !== i.id; }); location.hash = ""; route(); }
        else { resetDelete(); delMsg.textContent = "Could not delete. Try again."; }
      }).catch(function () { del.disabled = false; resetDelete(); delMsg.textContent = "Could not reach the site."; });
    };
    show("detail");
  }

  var EXPN = { hangout: "The Rounds", station: "The Station", show: "The Show" };
  var EXPHINT = { hangout: "Minimum booking: 2 hours.", station: "Minimum booking: 2 hours.", show: "45 minutes, seats up to 30." };
  function money(c) { return "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 }); }
  function dateNice(s) { return new Date(s + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }); }
  function linkFor(c) { return location.origin + "/sign/?t=" + c.token; }

  function renderContractPanel(i) {
    var box = $("d-contract"); box.replaceChildren();
    var c = i.contract;
    if (!c) {
      var b = el("button", "btn", "Start contract"); b.type = "button"; b.style.marginTop = "1.2rem";
      b.addEventListener("click", function () { openContractForm(i); });
      box.appendChild(b); return;
    }
    var p = el("div", "panel");
    p.appendChild(el("h2", null, "Contract: " + (c.status === "signed" ? "Signed" : "Sent, waiting for signature")));
    p.appendChild(el("p", null, EXPN[c.experience] + " \u00b7 " + dateNice(c.event_date)));
    p.appendChild(el("p", null, "Fee " + money(c.fee_cents) + " \u00b7 Deposit " + money(c.deposit_cents)));
    if (c.status === "signed") p.appendChild(el("p", null, "Signed by " + c.signed_name + " on " + new Date(c.signed_at).toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ". When the deposit arrives, set the status to Booked."));
    var row = el("div", "row2");
    if (c.status !== "signed") {
      var cp = el("button", "btn2 solid", "Copy link"); cp.type = "button";
      cp.addEventListener("click", function () {
        var u = linkFor(c);
        if (navigator.clipboard) navigator.clipboard.writeText(u).then(function () { cp.textContent = "Copied"; }, function () { prompt("Copy this link", u); });
        else prompt("Copy this link", u);
      });
      row.appendChild(cp);
    }
    var o = el("a", "btn2", c.status === "signed" ? "View signed agreement" : "Preview"); o.href = linkFor(c); o.target = "_blank"; o.rel = "noopener"; row.appendChild(o);
    if (c.status !== "signed") {
      var v = el("button", "btn2", "Void"); v.type = "button";
      v.addEventListener("click", function () {
        if (!confirm("Void this contract? The link will stop working.")) return;
        api("/api/admin/contract-void", { token: c.token }).then(function (d) {
          if (d.ok) load(); else alert(d.error || "Could not void it.");
        });
      });
      row.appendChild(v);
    }
    p.appendChild(row);
    box.appendChild(p);
  }

  var cf = { inquiry: null, exp: "", sel: "", editing: null, feeManual: false, profiles: [], delArmed: false };
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function addMinutes(t, m) { var p = t.split(":"), tot = (+p[0]) * 60 + (+p[1]) + m; tot = ((tot % 1440) + 1440) % 1440; return pad(Math.floor(tot / 60)) + ":" + pad(tot % 60); }
  var PF = [["pf-rb", "rounds_base"], ["pf-re", "rounds_extra"], ["pf-sb", "station_base"], ["pf-se", "station_extra"], ["pf-hf", "show_flat"]];
  function num(id) { var v = parseFloat($(id).value); return isFinite(v) && v >= 0 ? v : null; }
  function editorPrices() {
    var o = {}, ok = true;
    PF.forEach(function (f) { var v = num(f[0]); if (v === null) ok = false; o[f[1]] = v; });
    return ok ? o : null;
  }
  function selectedProfile() {
    return cf.profiles.filter(function (p) { return p.id === cf.sel; })[0] || null;
  }
  function activePrices() {
    if (cf.sel === "custom" || cf.editing) return editorPrices();
    return selectedProfile();
  }
  function minutesBetween() {
    var s = $("cf-start").value, e = $("cf-end").value;
    if (!s || !e) return null;
    var a = s.split(":"), b = e.split(":");
    var m = (+b[0]) * 60 + (+b[1]) - ((+a[0]) * 60 + (+a[1]));
    if (m <= 0) m += 1440;
    return m;
  }
  function hrs(m) { var h = m / 60; return (Math.round(h * 100) / 100) + (h === 1 ? " hr" : " hrs"); }
  function usd(n) { return "$" + (Math.round(n * 100) / 100).toLocaleString("en-US", { minimumFractionDigits: Math.round(n * 100) % 100 ? 2 : 0, maximumFractionDigits: 2 }); }
  function calc() {
    var p = activePrices();
    if (!p || !cf.exp) return null;
    if (cf.exp === "show") return { fee: p.show_flat, text: "The Show flat fee " + usd(p.show_flat), ot: null };
    var base = cf.exp === "hangout" ? p.rounds_base : p.station_base;
    var extra = cf.exp === "hangout" ? p.rounds_extra : p.station_extra;
    var m = minutesBetween();
    if (m === null) return { fee: base, text: "First 2 hrs " + usd(base) + ". Enter start and end times to add extra hours.", ot: extra };
    var over = Math.max(0, m - 120);
    var fee = Math.round((base + extra * over / 60) * 100) / 100;
    var text = over ? "First 2 hrs " + usd(base) + " + " + hrs(over) + " at " + usd(extra) + " = " + usd(fee) : "2 hr minimum " + usd(base) + (m < 120 ? " (booked time is under 2 hrs)" : "");
    return { fee: fee, text: text, ot: extra };
  }
  function updateSum() {
    var c = calc(), lines = [];
    if (c) lines.push(c.text);
    var f = parseFloat($("cf-fee").value);
    if (isFinite(f) && f > 0) {
      var fee = Math.round(f * 100), dep = Math.round(fee * 0.25);
      lines.push("Deposit (25%): " + money(dep) + "   Balance: " + money(fee - dep));
    } else { lines.push("Enter the fee to see the deposit."); }
    if (c && c.ot !== null) lines.push("Overtime: " + usd(c.ot) + " per hr, in 30 minute blocks (" + usd(c.ot / 2) + " each)");
    $("cf-sum").textContent = lines.join("\n");
  }
  function refreshPricing() {
    var c = calc();
    if (c && !cf.feeManual) $("cf-fee").value = c.fee;
    $("cf-feehint").hidden = !(c && cf.feeManual && parseFloat($("cf-fee").value) !== c.fee);
    updateSum();
  }
  function renderProfileSelect() {
    var sel = $("cf-profile"); sel.replaceChildren();
    var first = el("option", null, cf.profiles.length ? "Choose pricing" : "No saved profiles yet"); first.value = ""; sel.appendChild(first);
    cf.profiles.forEach(function (p) { var o = el("option", null, p.name); o.value = p.id; sel.appendChild(o); });
    var cu = el("option", null, "Custom prices"); cu.value = "custom"; sel.appendChild(cu);
    sel.value = cf.sel;
  }
  function profileSummary(p) {
    return "The Rounds: " + usd(p.rounds_base) + " first 2 hrs, " + usd(p.rounds_extra) + " each extra hr\nThe Station: " + usd(p.station_base) + " first 2 hrs, " + usd(p.station_extra) + " each extra hr\nThe Show: " + usd(p.show_flat) + " flat";
  }
  function fillEditor(p) {
    $("pf-name").value = p ? p.name : "";
    PF.forEach(function (f) { $(f[0]).value = p ? p[f[1]] : ""; });
    $("pf-msg").textContent = "";
  }
  function renderPricingUI() {
    var p = selectedProfile();
    $("cf-pinfo").hidden = !(p && !cf.editing);
    if (p) $("cf-pinfo").textContent = profileSummary(p);
    $("cf-pactions").hidden = !(p && !cf.editing);
    $("cf-editor").hidden = !(cf.sel === "custom" || cf.editing);
    $("pf-save").textContent = cf.editing ? "Save changes" : "Save as new profile";
    $("cf-pdel").textContent = "Delete profile"; cf.delArmed = false;
  }
  function loadProfiles(selectId) {
    return api("/api/admin/profiles").then(function (d) {
      cf.profiles = d.ok ? d.profiles : [];
      if (selectId !== undefined) cf.sel = selectId;
      renderProfileSelect(); renderPricingUI(); refreshPricing();
    }).catch(function () { cf.profiles = []; renderProfileSelect(); });
  }
  function renderExpButtons() {
    var seg = $("cf-exp"); seg.replaceChildren();
    ["hangout", "station", "show"].forEach(function (k) {
      var b = el("button", cf.exp === k ? "on" : "", EXPN[k]); b.type = "button";
      b.addEventListener("click", function () {
        cf.exp = k; renderExpButtons(); $("cf-exp-hint").textContent = EXPHINT[k];
        if (k === "show" && $("cf-start").value) $("cf-end").value = addMinutes($("cf-start").value, 45);
        refreshPricing();
      });
      seg.appendChild(b);
    });
  }
  function openContractForm(i) {
    cf.inquiry = i; cf.exp = ""; cf.sel = ""; cf.editing = null; cf.feeManual = false; cf.profiles = [];
    $("cf-title").textContent = "Contract for " + fullName(i);
    ["cf-date", "cf-start", "cf-end", "cf-fee"].forEach(function (id) { $(id).value = ""; });
    $("cf-venue").value = i.location || ""; $("cf-cname").value = fullName(i); $("cf-cemail").value = i.email;
    $("cf-err").textContent = ""; $("cf-exp-hint").textContent = ""; $("cf-create").disabled = false;
    fillEditor(null);
    renderExpButtons(); renderProfileSelect(); renderPricingUI(); refreshPricing(); show("cform");
    loadProfiles(undefined);
  }
  $("cf-profile").addEventListener("change", function () {
    cf.sel = this.value; cf.editing = null; cf.feeManual = false;
    if (cf.sel === "custom") fillEditor(null);
    renderPricingUI(); refreshPricing();
  });
  $("cf-pedit").addEventListener("click", function () {
    var p = selectedProfile(); if (!p) return;
    cf.editing = p.id; fillEditor(p); renderPricingUI(); refreshPricing();
  });
  $("cf-pdel").addEventListener("click", function () {
    var p = selectedProfile(); if (!p) return;
    if (!cf.delArmed) { cf.delArmed = true; this.textContent = "Tap again to delete"; return; }
    api("/api/admin/profiles", { action: "delete", id: p.id }).then(function (d) {
      if (d.ok) { cf.sel = ""; cf.editing = null; cf.profiles = d.profiles; renderProfileSelect(); renderPricingUI(); refreshPricing(); }
    });
  });
  PF.forEach(function (f) { $(f[0]).addEventListener("input", refreshPricing); });
  $("pf-save").addEventListener("click", function () {
    var msg = $("pf-msg"); msg.textContent = "";
    var pr = editorPrices(), name = $("pf-name").value.trim();
    if (!name) { msg.textContent = "Name it to save it."; return; }
    if (!pr) { msg.textContent = "Fill in all six prices."; return; }
    var body = { action: "save", id: cf.editing || "", name: name };
    PF.forEach(function (f) { body[f[1]] = pr[f[1]]; });
    api("/api/admin/profiles", body).then(function (d) {
      if (!d.ok) { msg.textContent = d.error || "Could not save."; return; }
      cf.profiles = d.profiles; cf.sel = d.id; cf.editing = null; cf.feeManual = false;
      renderProfileSelect(); renderPricingUI(); refreshPricing();
    }).catch(function () { msg.textContent = "Could not reach the site."; });
  });
  $("cf-fee").addEventListener("input", function () { cf.feeManual = true; refreshPricing(); });
  $("cf-recalc").addEventListener("click", function () { cf.feeManual = false; refreshPricing(); });
  $("cf-start").addEventListener("change", function () { if (cf.exp === "show" && this.value) $("cf-end").value = addMinutes(this.value, 45); refreshPricing(); });
  $("cf-end").addEventListener("change", refreshPricing);
  $("cf-back").addEventListener("click", function () { route(); });
  $("cf-create").addEventListener("click", function () {
    var err = $("cf-err"); err.textContent = "";
    if (!cf.exp) { err.textContent = "Pick an experience."; return; }
    var cc = calc();
    if (!cc) { err.textContent = "Choose pricing, or fill in all six custom prices."; return; }
    $("cf-create").disabled = true;
    api("/api/admin/contract", {
      inquiry_id: cf.inquiry.id, experience: cf.exp, event_date: $("cf-date").value, start_time: $("cf-start").value, end_time: $("cf-end").value,
      venue: $("cf-venue").value, fee: $("cf-fee").value, overtime_rate: cc.ot === null ? "" : cc.ot, client_name: $("cf-cname").value, client_email: $("cf-cemail").value
    }).then(function (d) {
      $("cf-create").disabled = false;
      if (!d.ok) { err.textContent = d.error || "Could not create the contract."; return; }
      load();
    }).catch(function () { $("cf-create").disabled = false; err.textContent = "Could not reach the site."; });
  });

  function route() {
    var id = location.hash.slice(1);
    if (id) renderDetail(id); else { renderList(); show("list"); }
  }

  function load() {
    return api("/api/admin/inquiries").then(function (d) {
      if (d.httpStatus === 401) { show("login"); return false; }
      if (!d.ok) { $("items").replaceChildren(el("p", "empty", "Could not load inquiries.")); show("list"); return false; }
      items = d.items; route(); return true;
    });
  }

  $("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    $("login-btn").disabled = true; $("login-err").textContent = "";
    api("/api/admin/login", { passphrase: $("pass").value }).then(function (d) {
      $("login-btn").disabled = false;
      if (d.ok) { $("pass").value = ""; load(); } else { $("login-err").textContent = d.error || "Could not sign in."; }
    }).catch(function () { $("login-btn").disabled = false; $("login-err").textContent = "Could not reach the site."; });
  });
  $("refresh").addEventListener("click", load);
  $("back").addEventListener("click", function () { location.hash = ""; });
  $("logout").addEventListener("click", function () {
    api("/api/admin/logout", {}).then(function () { items = []; show("login"); });
  });
  window.addEventListener("hashchange", route);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !location.hash && !$("list").hidden) load();
  });

  load();
})();
</script>
</body>
</html>
